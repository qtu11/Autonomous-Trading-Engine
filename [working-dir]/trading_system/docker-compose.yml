version: '3.8'

services:
  trading-backend:
    build: .
    container_name: ate-trading-backend
    ports:
      - "8848:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - TRADING_MODE=paper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ate-network

networks:
  ate-network:
    driver: bridge
