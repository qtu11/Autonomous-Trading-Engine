version: '3.8'

services:
  # Reverse Proxy - Nginx (public entry: 80/8080)
  nginx:
    image: nginx:alpine
    container_name: cloudlocal-nginx
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./volumes/logs/nginx:/var/log/nginx
    depends_on:
      - nextjs
      - fastapi
      - ai-engine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # Next.js Frontend
  nextjs:
    build:
      context: ../web
      dockerfile: ../Cloudlocal/nextjs/Dockerfile
    container_name: cloudlocal-nextjs
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # API base WITHOUT /api/v1 suffix - the frontend appends /api/... itself.
      # http://localhost:8080 -> nginx /api/ -> FastAPI 8005
      - NEXT_PUBLIC_ATE_API_ORIGIN=http://localhost:8080
      - NEXT_PUBLIC_QUANTAI_API_ORIGIN=http://localhost:8080
      - ATE_BACKEND_URL=http://nginx:80
    volumes:
      - ./volumes/logs/nextjs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # FastAPI Backend (Main API Server) - 0.0.0.0:8005
  fastapi:
    build:
      context: ../dashboard
      dockerfile: ../Cloudlocal/fastapi/Dockerfile
    container_name: cloudlocal-fastapi
    ports:
      - "8005:8005"
    environment:
      - PYTHONUNBUFFERED=1
      - ATE_EXECUTION_MODE=DEMO
      - QUANTAI_DASHBOARD_PORT=8005
      - QUANTAI_DASHBOARD_HOST=0.0.0.0
      - ATE_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://autonomous-trading-engine.vercel.app,http://${PUBLIC_IP}:8080,http://localhost:8080
      - QUANTAI_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://autonomous-trading-engine.vercel.app,http://${PUBLIC_IP}:8080,http://localhost:8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=quantai
      - POSTGRES_USER=quantai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quantai_secure_2024}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      - MT5_PATH=${MT5_PATH}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QUANTAI_AI_MODEL=${QUANTAI_AI_MODEL:-kimi-k3}
      - PUBLIC_IP=${PUBLIC_IP}
      - ATE_BACKEND_URL=http://${PUBLIC_IP}:8080
      - QUANTAI_LOG_DIR=/app/logs
      - ADMIN_LOGIN=${ADMIN_LOGIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - QUANTAI_BRIDGE_TOKEN=${QUANTAI_BRIDGE_TOKEN}
      - QUANTAI_OPERATOR_TOKEN=${QUANTAI_OPERATOR_TOKEN}
    volumes:
      - ../dashboard:/app
      - ./volumes/logs/fastapi:/app/logs
      - ./volumes/models:/app/models
      - ./volumes/history:/app/history
      - ./volumes/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # AI Engine Service
  ai-engine:
    build:
      context: ../dashboard
      dockerfile: ../Cloudlocal/ai-engine/Dockerfile
    container_name: cloudlocal-ai-engine
    ports:
      - "8006:8006"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ZPLAY_API_KEY=${ZPLAY_API_KEY}
      - QUANTAI_AI_MODEL=${QUANTAI_AI_MODEL:-kimi-k3}
      - AI_ENGINE_PORT=8006
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../dashboard:/app
      - ./ai-engine/app:/app/ai_engine:ro
      - ./volumes/models:/app/models
      - ./volumes/logs/ai-engine:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # Python Bridge to MT5 (Windows Host) - API/docs/health gateway.
  # NOTE: MT5 pip package on Linux cannot talk to a Windows-native terminal.
  # The real MT5 execution is done by the MQL5 EA (QuantAI_XAUUSD.mq5) via WebRequest.
  python-bridge:
    build:
      context: ../dashboard
      dockerfile: ../Cloudlocal/python-bridge/Dockerfile
    container_name: cloudlocal-python-bridge
    ports:
      - "8007:8007"
    environment:
      - PYTHONUNBUFFERED=1
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      - MT5_PATH=C:/Program Files/MetaTrader 5/terminal64.exe
      - BRIDGE_PORT=8007
      - FASTAPI_URL=http://fastapi:8005
      - QUANTAI_BRIDGE_TOKEN=${QUANTAI_BRIDGE_TOKEN}
      - PUBLIC_IP=${PUBLIC_IP}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../dashboard:/app
      - ./python-bridge/app:/app/bridge:ro
      - ./volumes/logs/python-bridge:/app/logs
      - ./volumes/config:/app/config
    depends_on:
      - fastapi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cloudlocal-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=quantai
      - POSTGRES_USER=quantai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quantai_secure_2024}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantai -d quantai"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cloudlocal-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --bind 0.0.0.0
    volumes:
      - ./volumes/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
