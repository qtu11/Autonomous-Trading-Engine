services:
  # =======================================================================
  # AUTONOMOUS TRADING ENGINE (ATE) - CLOUDLOCAL DOCKER STACK
  # =======================================================================
  # Standard URL Structure:
  #   Website : https://autonomous-trading-engine.vercel.app/
  #   Backend : https://autonomous-trading-engine.vercel.app/backend
  #   API/v1  : https://autonomous-trading-engine.vercel.app/api/v1
  # =======================================================================

  # Reverse Proxy - Nginx (public entry: 80/8080/8848)
  nginx:
    image: nginx:alpine
    container_name: cloudlocal-nginx
    ports:
      - "80:80"
      - "8080:80"
      - "8848:8848"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./volumes/logs/nginx:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nextjs
      - fastapi
      - ai-engine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # Next.js Frontend
  nextjs:
    build:
      context: ../web
      dockerfile: ../Cloudlocal/nextjs/Dockerfile
    container_name: cloudlocal-nextjs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ATE_API_ORIGIN=${NEXT_PUBLIC_ATE_API_ORIGIN:-http://localhost:8080}
      - NEXT_PUBLIC_ATE_API_ORIGIN=${NEXT_PUBLIC_ATE_API_ORIGIN:-http://localhost:8080}
      - ATE_BACKEND_URL=http://nginx:80
    volumes:
      - ./volumes/logs/nextjs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # FastAPI Backend (Main API Server) - 0.0.0.0:8005
  fastapi:
    build:
      context: ../dashboard
      dockerfile: ../Cloudlocal/fastapi/Dockerfile
    container_name: ate_backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ATE_LOG_DIR=/app/logs
      # Trading config
      - ATE_EXECUTION_MODE=${ATE_EXECUTION_MODE:-DEMO}
      - ATE_EXECUTION_MODE=${ATE_EXECUTION_MODE:-DEMO}
      - ATE_ENABLE_TRADING=${ATE_ENABLE_TRADING:-false}
      - ATE_DEMO_ARMED=${ATE_DEMO_ARMED:-true}
      - ATE_LIVE_ARMED=${ATE_LIVE_ARMED:-false}
      - ATE_KILL_SWITCH=${ATE_KILL_SWITCH:-true}
      - ATE_EXECUTION_SYMBOL=${ATE_EXECUTION_SYMBOL:-XAUUSDm}
      - ATE_EXECUTION_MAGIC=${ATE_EXECUTION_MAGIC:-888999}
      - ATE_MAGIC_NUMBER=${ATE_MAGIC_NUMBER:-888999}
      - ATE_DEMO_COMMAND_TTL_SECONDS=${ATE_DEMO_COMMAND_TTL_SECONDS:-10}
      - ATE_DEMO_BROKER_COMPANY=${ATE_DEMO_BROKER_COMPANY:-Exness Technologies Ltd}
      - ATE_LIVE_BROKER_COMPANY=${ATE_LIVE_BROKER_COMPANY:-Exness Technologies Ltd}
      # Dashboard
      - ATE_DASHBOARD_PORT=8005
      # BUG FIX: server.py gọi bridge/AI engine qua tên service Docker (trước đây
      # thiếu -> backend trong container không tới được bridge localhost:8007)
      - BRIDGE_URL=http://python-bridge:8007
      - AI_ENGINE_URL=http://ai-engine:8006
      - ATE_DASHBOARD_HOST=0.0.0.0
      # Database
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ate
      - POSTGRES_USER=ate
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ate_secure_2024}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Firebase
      - FIREBASE_ENABLE_SYNC=${FIREBASE_ENABLE_SYNC:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
    volumes:
      - ../dashboard:/app
      - ./volumes/logs/fastapi:/app/logs
      - ./volumes/models:/app/models
      - ./volumes/history:/app/history
      - ./volumes/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # AI Engine Service
  ai-engine:
    build:
      context: ../dashboard
      dockerfile: ../Cloudlocal/ai-engine/Dockerfile
    container_name: cloudlocal-ai-engine
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - AI_ENGINE_PORT=8006
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../dashboard:/app
      - ./ai-engine/app:/app/ai_engine:ro
      - ./volumes/models:/app/models
      - ./volumes/logs/ai-engine:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # Python Bridge to MT5 (Windows Host) - API/docs/health gateway.
  # NOTE: MT5 pip package on Linux cannot talk to a Windows-native terminal.
  # The real MT5 execution is done by the MQL5 EA (ATE_XAUUSD.mq5) via WebRequest.
  python-bridge:
    build:
      context: ../dashboard
      dockerfile: ../Cloudlocal/python-bridge/Dockerfile
    container_name: cloudlocal-python-bridge
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - BRIDGE_PORT=8007
      - FASTAPI_URL=http://fastapi:8005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../dashboard:/app
      - ./python-bridge/app:/app/bridge:ro
      - ./volumes/logs/python-bridge:/app/logs
      - ./volumes/config:/app/config
    depends_on:
      - fastapi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cloudlocal-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=ate
      - POSTGRES_USER=ate
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ate_secure_2024}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ate -d ate"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cloudlocal-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --bind 0.0.0.0
    volumes:
      - ./volumes/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
