services:
  # FastAPI Backend for Railway Deployment
  api:
    build:
      context: .
      dockerfile: Dockerfile.railway
    ports:
      - "8080:8005"
    environment:
      # Execution Mode - DEMO for safety in production
      - PYTHONUNBUFFERED=1
      - ATE_EXECUTION_MODE=${ATE_EXECUTION_MODE:-DEMO}
      - QUANTAI_EXECUTION_MODE=${QUANTAI_EXECUTION_MODE:-DEMO}
      - QUANTAI_ENABLE_TRADING=${QUANTAI_ENABLE_TRADING:-false}
      - QUANTAI_DEMO_ARMED=${QUANTAI_DEMO_ARMED:-true}
      - QUANTAI_LIVE_ARMED=${QUANTAI_LIVE_ARMED:-false}
      - QUANTAI_KILL_SWITCH=${QUANTAI_KILL_SWITCH:-true}
      - QUANTAI_EXECUTION_SYMBOL=${QUANTAI_EXECUTION_SYMBOL:-XAUUSDm}
      - QUANTAI_EXECUTION_MAGIC=${QUANTAI_EXECUTION_MAGIC:-888999}
      - QUANTAI_MAGIC_NUMBER=${QUANTAI_MAGIC_NUMBER:-888999}
      - QUANTAI_DEMO_COMMAND_TTL_SECONDS=${QUANTAI_DEMO_COMMAND_TTL_SECONDS:-10}
      - QUANTAI_DEMO_LOGIN=${QUANTAI_DEMO_LOGIN}
      - QUANTAI_DEMO_SERVER=${QUANTAI_DEMO_SERVER}
      - QUANTAI_DEMO_BROKER_COMPANY=${QUANTAI_DEMO_BROKER_COMPANY:-Exness Technologies Ltd}
      - QUANTAI_LIVE_LOGIN=${QUANTAI_LIVE_LOGIN}
      - QUANTAI_LIVE_SERVER=${QUANTAI_LIVE_SERVER}
      - QUANTAI_LIVE_BROKER_COMPANY=${QUANTAI_LIVE_BROKER_COMPANY:-Exness Technologies Ltd}

      # MT5 (EA MQL5 tự đăng nhập & báo cáo account — không cần credentials)
      - MT5_PATH=${MT5_PATH:-C:/Program Files/MetaTrader 5-1/terminal64.exe}
      - MT5_TERMINAL_TIMEOUT_SECONDS=${MT5_TERMINAL_TIMEOUT_SECONDS:-30}
      - MT5_AUTOSTART=${MT5_AUTOSTART:-false}

      # Admin & Bridge
      - ADMIN_LOGIN=${ADMIN_LOGIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - QUANTAI_BRIDGE_TOKEN=${QUANTAI_BRIDGE_TOKEN}
      - QUANTAI_OPERATOR_TOKEN=${QUANTAI_OPERATOR_TOKEN}

      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-true}

      # AI Engine
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - ZPLAY_API_KEY=${ZPLAY_API_KEY}
      - ZPLAY_BASE_URL=${ZPLAY_BASE_URL:-https://router.flatkey.ai/v1}
      - QUANTAI_AI_MODEL=${QUANTAI_AI_MODEL:-deepseek-v4-flash-free}
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-https://opencode.ai/zen/v1/chat/completions}
      - GATEWAY_URL=${GATEWAY_URL}
      - GATEWAY_KEY=${GATEWAY_KEY}

      # Database
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-quantai}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}

      # Network & CORS
      - ATE_DASHBOARD_PORT=8005
      - ATE_DASHBOARD_HOST=0.0.0.0
      - QUANTAI_DASHBOARD_PORT=8005
      - QUANTAI_DASHBOARD_HOST=0.0.0.0

      # Vercel Frontend CORS
      - ATE_ALLOWED_ORIGINS=https://autonomous-trading-engine.vercel.app,https://*.vercel.app
      - QUANTAI_ALLOWED_ORIGINS=https://autonomous-trading-engine.vercel.app,https://*.vercel.app
      - ATE_BACKEND_URL=https://quantai-api.up.railway.app

      # Firebase
      - FIREBASE_ENABLE_SYNC=${FIREBASE_ENABLE_SYNC:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
